name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        # server.py 依赖 aiohttp（由 ComfyUI 运行时提供，不作为插件依赖声明），
        # test_upstream_gate 导入它，因此 CI 上要单独装一次。
        run: |
          pip install aiohttp
          python -m unittest discover -s tests -p "test_*.py"
